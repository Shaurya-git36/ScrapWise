<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>A digital scale weighing newspapers, cardboard and iron while the payout grows from 60 to 106 rupees</title>
<style>
  .lcd{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#123d2f;text-anchor:middle}
  .tag{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:12px;fill:#183a2c;text-anchor:middle}
  .coin-t{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:14px;fill:#7a5a10;text-anchor:middle}
  .sA{opacity:1;animation:sA 9s infinite}
  .sB{opacity:0;animation:sB 9s infinite}
  .sC{opacity:0;animation:sC 9s infinite}
  .dropB{animation:dropB 9s infinite both}
  .dropC{animation:dropC 9s infinite both}
  .coin{opacity:0;animation:pop 9s infinite both}
  .coin.c2{animation-delay:3s}
  .coin.c3{animation-delay:6s}
  @keyframes sA{0%,30%{opacity:1}33%,96%{opacity:0}100%{opacity:1}}
  @keyframes sB{0%,30%{opacity:0}33%,63%{opacity:1}66%,100%{opacity:0}}
  @keyframes sC{0%,63%{opacity:0}66%,95%{opacity:1}98%,100%{opacity:0}}
  @keyframes dropB{0%,31%{opacity:0;transform:translateY(-44px)}37%{opacity:1;transform:translateY(0)}95%{opacity:1;transform:translateY(0)}99%,100%{opacity:0;transform:translateY(0)}}
  @keyframes dropC{0%,64%{opacity:0;transform:translateY(-44px)}70%{opacity:1;transform:translateY(0)}95%{opacity:1;transform:translateY(0)}99%,100%{opacity:0;transform:translateY(0)}}
  @keyframes pop{0%{opacity:0;transform:translateY(0)}4%{opacity:1}16%{opacity:0;transform:translateY(-46px)}100%{opacity:0;transform:translateY(-46px)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .sA,.sB{opacity:0}.sC{opacity:1}
    .dropB,.dropC{opacity:1;transform:none}
    .coin{opacity:0}
  }
</style>
<defs>
  <g id="bottle">
    <rect x="11" y="0" width="14" height="8" rx="2" fill="#2a7fb8"/>
    <rect x="10" y="8" width="16" height="14" fill="#cdeaf5" stroke="#6fb4d0" stroke-width="1.5"/>
    <rect x="0" y="20" width="36" height="40" rx="9" fill="#cdeaf5" stroke="#6fb4d0" stroke-width="1.5"/>
    <rect x="4" y="32" width="28" height="12" fill="#2a7fb8" opacity=".85"/>
  </g>
</defs>

<!-- backdrop -->
<rect width="560" height="480" fill="#d4f2bf"/>
<circle cx="290" cy="215" r="188" fill="#e8f9d6"/>
<circle cx="290" cy="215" r="206" fill="none" stroke="#a9d98a" stroke-width="2" stroke-dasharray="3 11" stroke-linecap="round"/>

<!-- ground -->
<rect y="432" width="560" height="48" fill="#1b5a42"/>
<ellipse cx="280" cy="438" rx="190" ry="8" fill="#0e3326" opacity=".35"/>

<!-- plastic bottles + tag (left, on the floor) -->
<use href="#bottle" x="24" y="372"/>
<use href="#bottle" x="62" y="372"/>
<line x1="60" y1="356" x2="60" y2="376" stroke="#b08a4e" stroke-width="2"/>
<rect x="26" y="336" width="68" height="22" rx="11" fill="#b9e873"/>
<text class="tag" x="60" y="351">₹10/kg</text>

<!-- e-waste circuit board (right, leaning) -->
<g transform="rotate(-8 509 400)">
  <rect x="478" y="366" width="62" height="66" rx="4" fill="#1f8a5b" stroke="#0e5a3b" stroke-width="2"/>
  <path d="M486 424H512V404M530 424V392H516M486 378H504M522 378H532" fill="none" stroke="#f2c14e" stroke-width="2"/>
  <rect x="492" y="386" width="26" height="18" rx="2" fill="#123d2f"/>
  <circle cx="530" cy="378" r="5" fill="#f2c14e"/>
  <circle cx="488" cy="424" r="3" fill="#f2c14e"/>
</g>
<line x1="510" y1="360" x2="510" y2="372" stroke="#b08a4e" stroke-width="2"/>
<rect x="478" y="338" width="64" height="22" rx="11" fill="#b9e873"/>
<text class="tag" x="510" y="353">₹20/kg</text>

<!-- scale -->
<rect x="110" y="404" width="340" height="28" rx="8" fill="#123d2f"/>
<rect x="128" y="430" width="26" height="6" rx="3" fill="#0b2a20"/>
<rect x="406" y="430" width="26" height="6" rx="3" fill="#0b2a20"/>
<rect x="100" y="388" width="310" height="16" rx="6" fill="#e4ede5" stroke="#123d2f" stroke-width="3"/>
<rect x="420" y="262" width="22" height="170" rx="8" fill="#174d39"/>
<rect x="356" y="168" width="150" height="104" rx="16" fill="#123d2f"/>
<rect x="368" y="180" width="126" height="66" rx="8" fill="#c7f18a"/>
<circle cx="400" cy="259" r="4" fill="#4f9c75"/>
<circle cx="431" cy="259" r="4" fill="#4f9c75"/>
<circle cx="462" cy="259" r="4" fill="#4f9c75"/>

<!-- display readouts: 5 kg paper, then +2 kg cardboard, then +1 kg iron -->
<g class="sA"><text class="lcd" x="431" y="218" font-size="34">₹60</text><text class="lcd" x="431" y="238" font-size="13">5.0 kg</text></g>
<g class="sB"><text class="lcd" x="431" y="218" font-size="34">₹76</text><text class="lcd" x="431" y="238" font-size="13">7.0 kg</text></g>
<g class="sC"><text class="lcd" x="431" y="218" font-size="34">₹106</text><text class="lcd" x="431" y="238" font-size="13">8.0 kg</text></g>

<!-- coins pop out of the display when the total changes -->
<g class="coin c2"><circle cx="400" cy="156" r="14" fill="#f2c14e" stroke="#c99a2e" stroke-width="2"/><text class="coin-t" x="400" y="161">₹</text></g>
<g class="coin c3"><circle cx="462" cy="156" r="14" fill="#f2c14e" stroke="#c99a2e" stroke-width="2"/><text class="coin-t" x="462" y="161">₹</text></g>

<!-- newspapers (always on the scale) -->
<g>
  <rect x="126" y="346" width="98" height="42" rx="3" fill="#f3ead3" stroke="#b9ab86" stroke-width="1.5"/>
  <rect x="132" y="322" width="88" height="24" rx="3" fill="#ebe0c3" stroke="#b9ab86" stroke-width="1.5"/>
  <rect x="138" y="302" width="78" height="20" rx="3" fill="#f3ead3" stroke="#b9ab86" stroke-width="1.5"/>
  <rect x="136" y="356" width="50" height="6" fill="#24372f" opacity=".75"/>
  <rect x="136" y="368" width="76" height="3" fill="#24372f" opacity=".35"/>
  <rect x="136" y="376" width="60" height="3" fill="#24372f" opacity=".35"/>
  <rect x="170" y="302" width="4" height="86" fill="#b08a4e"/>
  <line x1="174" y1="280" x2="174" y2="302" stroke="#b08a4e" stroke-width="2"/>
  <rect x="138" y="258" width="72" height="22" rx="11" fill="#b9e873"/>
  <text class="tag" x="174" y="273">₹12/kg</text>
</g>

<!-- cardboard drops on at the second reading -->
<g class="dropB">
  <rect x="240" y="356" width="84" height="32" fill="#c8924f" stroke="#8f6330" stroke-width="1.5"/>
  <rect x="276" y="356" width="12" height="32" fill="#e3bd82"/>
  <rect x="248" y="330" width="68" height="26" fill="#d6a45f" stroke="#8f6330" stroke-width="1.5"/>
  <rect x="276" y="330" width="12" height="26" fill="#e3bd82"/>
  <line x1="282" y1="314" x2="282" y2="330" stroke="#b08a4e" stroke-width="2"/>
  <rect x="249" y="292" width="66" height="22" rx="11" fill="#b9e873"/>
  <text class="tag" x="282" y="307">₹8/kg</text>
</g>

<!-- iron rods drop on at the third reading -->
<g class="dropC">
  <rect x="336" y="372" width="66" height="12" rx="6" fill="#7d8b92"/>
  <rect x="340" y="359" width="58" height="12" rx="6" fill="#98a6ad"/>
  <rect x="338" y="346" width="62" height="12" rx="6" fill="#6c7a81"/>
  <rect x="345" y="349" width="40" height="3" rx="1.5" fill="#fff" opacity=".35"/>
  <line x1="369" y1="330" x2="369" y2="346" stroke="#b08a4e" stroke-width="2"/>
  <rect x="337" y="308" width="64" height="22" rx="11" fill="#b9e873"/>
  <text class="tag" x="369" y="323">₹30/kg</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
